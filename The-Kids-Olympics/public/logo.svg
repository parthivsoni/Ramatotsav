<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">

  <defs>
    <!-- Pink text gradient -->
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4fa3"></stop>
      <stop offset="100%" stop-color="#d6006f"></stop>
    </linearGradient>

    <!-- Underline gradient -->
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5fa8"></stop>
      <stop offset="100%" stop-color="#b3006b"></stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"></feDropShadow>
    </filter>

  </defs>

  <!-- White outline -->
  <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-size="260" font-family="Pacifico, Lobster, cursive" fill="white" stroke="white" stroke-width="22">
    Ramatotsav
  </text>

  <!-- Main text -->
  <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-size="260" font-family="Pacifico, Lobster, cursive" fill="url(#pinkGrad)" filter="url(#glow)">
    Ramatotsav
  </text>

  <!-- Wavy underline -->
  <path d="M350 350
           C550 420, 850 420, 1150 350" fill="none" stroke="url(#waveGrad)" stroke-width="30" stroke-linecap="round"></path>

  <!-- Sparkles -->
  <circle cx="650" cy="360" r="6" fill="#ffd1ea"></circle>
  <circle cx="780" cy="340" r="5" fill="#ffe6f3"></circle>
  <circle cx="920" cy="360" r="6" fill="#ffd1ea"></circle>

</svg>
